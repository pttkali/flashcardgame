<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Almanca Flash Kartlar</title>
<style>
  :root {
    --bg: #f7f6f3; --surface: #ffffff; --surface2: #f0ede8;
    --text: #1a1a1a; --muted: #6b6860; --border: #ddd9d0;
    --correct: #2e7d57; --correct-bg: #4caf8320;
    --wrong: #a33030; --wrong-bg: #e05a5a20;
    --partial: #8a5c00; --partial-bg: #f5a62320;
    --accent: #4a7fd4;
    --radius: 12px; --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151f; --surface: #1a1e2e; --surface2: #161929;
      --text: #f0ece2; --muted: #6b6860; --border: #2a2f45;
      --accent: #6b9ff0;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh; display: flex; justify-content: center;
    padding: 0 16px 60px;
  }
  #app { width: 100%; max-width: 780px; }
  .screen { display: none; } .screen.active { display: block; }
  h2 { font-size: 18px; font-weight: 500; margin-bottom: 10px; }
  p  { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 12px; }
  textarea {
    width: 100%; min-height: 200px; font-family: 'Courier New', monospace; font-size: 13px;
    padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); resize: vertical; line-height: 1.8;
  }
  textarea:focus { outline: none; border-color: var(--text); }
  .btn {
    padding: 9px 20px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 14px; cursor: pointer; transition: opacity .15s;
  }
  .btn:hover { opacity: 0.75; } .btn:disabled { opacity: 0.35; cursor: default; }
  .btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
  .btn.primary:hover { opacity: 0.82; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .error { font-size: 13px; color: var(--wrong); margin-top: 6px; }
  .info-box {
    background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 10px 14px; font-family: 'Courier New', monospace; font-size: 12px;
    color: var(--muted); line-height: 1.9; margin-bottom: 12px;
  }
  .prog { height: 3px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: 20px; }
  .progf { height: 100%; background: var(--text); transition: width .3s; }
  .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .card-wrap { perspective: 1000px; height: 260px; margin: 0 0 6px; cursor: pointer; user-select: none; }
  .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform .5s cubic-bezier(.4,0,.2,1); }
  .card-inner.fl { transform: rotateY(180deg); }
  .cface {
    position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--radius);
    border: 1px solid var(--border); display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px; background: var(--surface); text-align: center; overflow: hidden;
  }
  .cface.back { transform: rotateY(180deg); background: var(--surface2); justify-content: flex-start; padding-top: 20px; overflow-y: auto; }
  .clabel { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px; }
  .cword { font-size: 26px; font-weight: 600; margin-bottom: 6px; line-height: 1.2; }
  .csub { font-size: 13px; color: var(--muted); }
  .cdefs { font-size: 14px; line-height: 1.9; width: 100%; }
  .ditem { display: flex; align-items: center; gap: 8px; margin: 2px 0; text-align: left; }
  .ddot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  .fhint { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 12px; }
  .albl { font-size: 13px; color: var(--muted); margin: 12px 0 8px; }
  .arow { display: flex; gap: 8px; }
  .ainp {
    flex: 1; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); font-size: 14px;
  }
  .ainp:focus { outline: none; border-color: var(--text); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; min-height: 22px; margin-top: 8px; }
  .tok   { font-size: 12px; padding: 3px 10px; border-radius: 100px; background: var(--correct-bg); color: var(--correct); }
  .tfail { font-size: 12px; padding: 3px 10px; border-radius: 100px; background: var(--wrong-bg); color: var(--wrong); }
  .fb { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
  .fb.good { color: var(--correct); }
  .navrow { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; gap: 8px; }
  .sgrid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin: 16px 0; }
  .scard { background: var(--surface2); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
  .snum { font-size: 26px; font-weight: 600; } .slbl { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .ritem { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .bdg { font-size: 11px; padding: 2px 8px; border-radius: 100px; font-weight: 500; white-space: nowrap; }
  .bok { background: var(--correct-bg); color: var(--correct); }
  .bpart { background: var(--partial-bg); color: var(--partial); }
  .bfail { background: var(--wrong-bg); color: var(--wrong); }
  .rword { font-weight: 500; font-size: 14px; min-width: 120px; }
  .rdefs { font-size: 13px; color: var(--muted); flex: 1; }
  .rpts  { font-size: 13px; color: var(--muted); white-space: nowrap; }

  /* Accordion */
  .acc-group { margin-bottom: 8px; }
  .acc-header {
    width: 100%; text-align: left; padding: 11px 16px;
    border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface); color: var(--text);
    font-size: 15px; font-weight: 600; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center;
    transition: opacity .15s;
  }
  .acc-header:hover { opacity: 0.75; }
  .acc-header .acc-arrow { font-size: 11px; color: var(--muted); transition: transform .2s; }
  .acc-header.open .acc-arrow { transform: rotate(180deg); }
  .acc-body { display: none; padding: 10px 0 4px 0; }
  .acc-body.open { display: block; }
  .sec-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .sec-btn {
    padding: 7px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--surface2); color: var(--text); font-size: 13px; cursor: pointer; transition: opacity .15s;
  }
  .sec-btn:hover { opacity: 0.7; }
  .sec-btn .sec-count { font-size: 11px; color: var(--muted); margin-left: 5px; }

  /* Ana sayfa */
  .home-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 0 24px;
    font-size: 14px; color: var(--muted);
  }
  .home-header strong { color: var(--text); }
  .home-nav {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    overflow: hidden; margin-bottom: 24px;
  }
  .home-nav-btn {
    padding: 14px 10px; background: var(--surface); border: none; border-right: 1px solid var(--border);
    color: var(--muted); font-size: 14px; cursor: pointer; transition: background .15s, color .15s;
  }
  .home-nav-btn:last-child { border-right: none; }
  .home-nav-btn:hover { background: var(--surface2); color: var(--text); }
  .home-nav-btn.active { background: var(--surface2); color: var(--text); font-weight: 600; }
  .home-pane { display: none; }
  .home-pane.active { display: block; }

  /* Kelimeler ekranı */
  .word-search {
    width: 100%; padding: 11px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface); color: var(--text); font-size: 14px; margin-bottom: 20px;
  }
  .word-search:focus { outline: none; border-color: var(--text); }
  .word-search::placeholder { color: var(--muted); }
  .metin-group { margin-bottom: 24px; }
  .metin-title {
    font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px;
  }
  .word-item {
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .word-item .w-de { font-size: 15px; font-weight: 700; color: var(--accent); }
  .word-item .w-tr { font-size: 13px; color: var(--accent); opacity: 0.75; margin: 1px 0 2px; }
  .word-item .w-syn { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<div id="app">

<!-- ANA SAYFA -->
<div id="screen-home" class="screen active">
  <div class="home-header">
    <span>Hoş geldin</span>
    <button class="btn" style="padding:5px 14px;font-size:13px;" onclick="resetHome()">Çıkış</button>
  </div>
  <div class="home-nav">
    <button class="home-nav-btn" id="hnav-karisik" onclick="homeNav('karisik')">Karışık Oyna</button>
    <button class="home-nav-btn" id="hnav-kelimeler" onclick="homeNav('kelimeler')">Kelimeler</button>
    <button class="home-nav-btn" id="hnav-bolumler" onclick="homeNav('bolumler')">Bölümler</button>
  </div>

  <div class="home-pane" id="hpane-karisik">
    <div class="row" style="margin-top:0;">
      <button class="btn primary" onclick="startWithSaved()">Tümüyle Oyna</button>
      <button class="btn" onclick="startRandom(20)">Rastgele 20 Kart</button>
      <button class="btn" onclick="startRandom(10)">Rastgele 10 Kart</button>
    </div>
  </div>

  <div class="home-pane" id="hpane-kelimeler">
    <input class="word-search" id="word-search" type="text" placeholder="Kelime ara..." oninput="filterWords(this.value)" />
    <div id="word-list"></div>
  </div>

  <div class="home-pane" id="hpane-bolumler">
    <div id="acc-render"></div>
  </div>
</div>

<!-- OYUN EKRANI -->
<div id="screen-game" class="screen">
  <div class="prog"><div class="progf" id="progf"></div></div>
  <div class="topbar">
    <span id="counter">1/1</span>
    <span>Puan: <strong id="lscore">0</strong></span>
    <button class="btn" style="padding:5px 14px;font-size:13px;" onclick="show('screen-home')">Menü</button>
  </div>
  <div class="card-wrap" onclick="flipCard()">
    <div class="card-inner" id="cinner">
      <div class="cface front">
        <div class="clabel">Kelime</div>
        <div class="cword" id="cword">—</div>
        <div class="csub" id="csub"></div>
      </div>
      <div class="cface back">
        <div class="clabel">Anlamlar</div>
        <div class="cdefs" id="cdefs"></div>
      </div>
    </div>
  </div>
  <div class="fhint" id="fhint">Kartı çevirmek için tıkla</div>
  <div id="aarea">
    <div class="albl" id="albl">En az 2 anlamı yaz — her cevabı Enter ile ekle:</div>
    <div class="arow">
      <input class="ainp" id="ainp" type="text" placeholder="Cevap yaz..." autocomplete="off" autocorrect="off" spellcheck="false"/>
      <button class="btn" onclick="addAns()">Ekle</button>
    </div>
    <div class="tags" id="atags"></div>
    <div class="fb" id="afb"></div>
  </div>
  <div class="navrow">
    <button class="btn" onclick="skipCard()">Atla</button>
    <button class="btn primary" id="btnnext" onclick="nextCard()" disabled>Sonraki →</button>
  </div>
  <div style="margin-top:10px;">
    <button class="btn" onclick="toggleTr()" style="width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;">
      <span>Türkçe anlamı göster</span><span id="tr-arrow" style="font-size:11px;color:var(--muted);">▼</span>
    </button>
    <div id="tr-body" style="display:none;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);font-size:14px;line-height:1.9;"></div>
  </div>
</div>

<!-- SONUÇ EKRANI -->
<div id="screen-result" class="screen">
  <h2>Tur Bitti!</h2>
  <div class="sgrid">
    <div class="scard"><div class="snum" id="rscore">0</div><div class="slbl">Toplam Puan</div></div>
    <div class="scard"><div class="snum" id="rcorrect">0</div><div class="slbl">Tam Doğru</div></div>
    <div class="scard"><div class="snum" id="rpartial">0</div><div class="slbl">Kısmen</div></div>
  </div>
  <div id="rlist"></div>
  <div class="row" style="margin-top:20px;">
    <button class="btn primary" onclick="restartGame()">Tekrar Oyna</button>
    <button class="btn" onclick="show('screen-home')">← Menü</button>
  </div>
</div>

</div>

let ALL_CARDS = [];
let cards=[], cur=0, score=0, results=[], typed=[], answered=false, flipped=false;

function parseCards(raw) {
  const out = [];
  raw.split('\n').forEach(line => {
    const l = line.trim();
    if (!l) return;
    const eq = l.indexOf('=');
    if (eq < 0) return;
    const word = l.slice(0, eq).trim();
    const meanings = l.slice(eq+1).split(',').map(m => m.trim().toLowerCase()).filter(m => m);
    if (word && meanings.length >= 1) out.push({ word, meanings });
  });
  return out;
}

// ALL_CARDS = tüm bölümlerdeki kelimeler
Object.values(SECTIONS).forEach(grup => {
  Object.values(grup).forEach(raw => {
    ALL_CARDS = ALL_CARDS.concat(parseCards(raw));
  });
});

// Accordion render
function renderAcc() {
  const container = document.getElementById('acc-render');
  let html = '';
  Object.entries(SECTIONS).forEach(([grupAdi, bolumler]) => {
    const grupId = 'acc-' + grupAdi;
    const totalCount = Object.values(bolumler).reduce((s, r) => s + parseCards(r).length, 0);
    html += `<div class="acc-group">
      <button class="acc-header" id="${grupId}-btn" onclick="toggleAcc('${grupId}')">
        <span>${grupAdi} <span style="font-size:12px;font-weight:400;color:var(--muted)">${totalCount} kelime</span></span>
        <span class="acc-arrow">▼</span>
      </button>
      <div class="acc-body" id="${grupId}-body">
        <div class="sec-list">`;
    Object.entries(bolumler).forEach(([bolumAdi, raw]) => {
      const count = parseCards(raw).length;
      html += `<button class="sec-btn" onclick="startSection('${grupAdi}','${bolumAdi}')">
        ${bolumAdi} <span class="sec-count">${count} kelime</span>
      </button>`;
    });
    html += `</div></div></div>`;
  });
  container.innerHTML = html;
}
renderAcc();

// Kelimeler listesi render — METIN başlıkları SECTIONS key'leri
const METIN_LABELS = {
  "T1": "Metin 1 – Johannes Gutenberg"
};
function renderWords(filter) {
  const q = (filter || '').toLowerCase().trim();
  let html = '';
  Object.entries(SECTIONS).forEach(([grupAdi, bolumler]) => {
    Object.entries(bolumler).forEach(([bolumAdi, raw]) => {
      const cards = parseCards(raw);
      const filtered = q ? cards.filter(c =>
        c.word.toLowerCase().includes(q) ||
        (TURKISH[c.word]||'').toLowerCase().includes(q) ||
        c.meanings.some(m => m.includes(q))
      ) : cards;
      if (filtered.length === 0) return;
      const label = METIN_LABELS[bolumAdi] || (grupAdi + ' – ' + bolumAdi);
      html += `<div class="metin-group">
        <div class="metin-title">${label}</div>`;
      filtered.forEach(c => {
        const tr = TURKISH[c.word] || '';
        html += `<div class="word-item">
          <div class="w-de">${c.word}</div>
          ${tr ? `<div class="w-tr">${tr}</div>` : ''}
          <div class="w-syn">${c.meanings.join(', ')}</div>
        </div>`;
      });
      html += `</div>`;
    });
  });
  document.getElementById('word-list').innerHTML = html || '<p style="color:var(--muted)">Sonuç bulunamadı.</p>';
}

function filterWords(val) { renderWords(val); }

function resetHome() {
  document.querySelectorAll('.home-nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.home-pane').forEach(p => p.classList.remove('active'));
  show('screen-home');
}
function homeNav(tab) {
  document.querySelectorAll('.home-nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.home-pane').forEach(p => p.classList.remove('active'));
  document.getElementById('hnav-' + tab).classList.add('active');
  document.getElementById('hpane-' + tab).classList.add('active');
  if (tab === 'kelimeler') renderWords('');
}

function toggleAcc(id) {
  const btn = document.getElementById(id + '-btn');
  const body = document.getElementById(id + '-body');
  const isOpen = body.classList.contains('open');
  document.querySelectorAll('.acc-body').forEach(b => b.classList.remove('open'));
  document.querySelectorAll('.acc-header').forEach(b => b.classList.remove('open'));
  if (!isOpen) { body.classList.add('open'); btn.classList.add('open'); }
}

function startWithSaved() { launchGame([...ALL_CARDS].sort(() => Math.random() - .5)); }
function startRandom(n) {
  const sh = [...ALL_CARDS].sort(() => Math.random() - .5);
  launchGame(sh.slice(0, Math.min(n, sh.length)));
}
function startSection(grup, bolum) {
  launchGame(parseCards(SECTIONS[grup][bolum]).sort(() => Math.random() - .5));
}
function launchGame(cardList) {
  cards = cardList; cur = 0; score = 0; results = [];
  show('screen-game'); loadCard();
}
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function required(c) { return c.meanings.length === 1 ? 1 : 2; }
function loadCard() {
  flipped = false; answered = false; typed = [];
  document.getElementById('cinner').classList.remove('fl');
  document.getElementById('ainp').value = '';
  document.getElementById('atags').innerHTML = '';
  document.getElementById('afb').textContent = '';
  document.getElementById('afb').className = 'fb';
  document.getElementById('btnnext').disabled = true;
  document.getElementById('aarea').style.display = 'block';
  document.getElementById('fhint').textContent = 'Kartı çevirmek için tıkla';
  const c = cards[cur];
  document.getElementById('cword').textContent = c.word;
  document.getElementById('csub').textContent = c.meanings.length + ' anlam';
  document.getElementById('counter').textContent = (cur+1) + '/' + cards.length;
  document.getElementById('progf').style.width = ((cur / cards.length) * 100) + '%';
  document.getElementById('lscore').textContent = score;
  document.getElementById('cdefs').innerHTML = c.meanings.map(m =>
    `<div class="ditem"><div class="ddot"></div><span>${m}</span></div>`).join('');
  const req = required(c);
  document.getElementById('albl').textContent = req === 1
    ? 'Doğru anlamı yaz ve Enter\'a bas:'
    : 'En az 2 anlamı yaz — her cevabı Enter ile ekle:';
  const inp = document.getElementById('ainp');
  inp.focus();
  inp.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); addAns(); } };
  loadTr(c);
}
function toggleTr() {
  const body = document.getElementById("tr-body");
  const arrow = document.getElementById("tr-arrow");
  const isOpen = body.style.display !== "none";
  body.style.display = isOpen ? "none" : "block";
  arrow.textContent = isOpen ? "▼" : "▲";
}
function loadTr(c) {
  const body = document.getElementById("tr-body");
  const tr = TURKISH[c.word];
  if (tr) {
    body.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin:2px 0;"><div style="width:5px;height:5px;border-radius:50%;background:var(--muted);flex-shrink:0;"></div><span>${tr}</span></div>`;
  } else {
    body.innerHTML = `<span style="color:var(--muted);font-size:13px;">Türkçe anlam eklenmedi.</span>`;
  }
  body.style.display = "none";
  const arrow = document.getElementById("tr-arrow");
  if(arrow) arrow.textContent = "▼";
}
function flipCard() {
  flipped = !flipped;
  document.getElementById('cinner').classList.toggle('fl', flipped);
  document.getElementById('fhint').textContent = flipped ? 'Geri çevirmek için tıkla' : 'Kartı çevirmek için tıkla';
}
function norm(s) {
  return s.trim().toLowerCase()
    .replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}
function exactMatch(input, meaning) { return norm(input) === norm(meaning); }
function addAns() {
  if (answered) return;
  const inp = document.getElementById('ainp');
  const val = inp.value.trim();
  if (!val) return;
  val.split(',').map(p => p.trim()).filter(p => p).forEach(p => {
    if (!typed.find(t => norm(t) === norm(p))) typed.push(p.toLowerCase());
  });
  inp.value = '';
  renderTags(); checkLive();
}
function renderTags() {
  const c = cards[cur];
  document.getElementById('atags').innerHTML = typed.map(a => {
    const ok = c.meanings.some(m => exactMatch(a, m));
    return `<span class="${ok ? 'tok' : 'tfail'}">${a}</span>`;
  }).join('');
}
function checkLive() {
  if (answered) return;
  const c = cards[cur];
  const matched = c.meanings.filter(m => typed.some(a => exactMatch(a, m)));
  const req = required(c);
  const fb = document.getElementById('afb');
  if (matched.length >= req) {
    const full = matched.length >= c.meanings.length;
    const pts = full ? c.meanings.length : matched.length;
    fb.textContent = full
      ? `Mükemmel! Tüm anlamları buldun. +${pts} puan`
      : `${matched.length}/${c.meanings.length} anlam bulundu. +${pts} puan`;
    fb.className = 'fb good';
    document.getElementById('btnnext').disabled = false;
  } else {
    if (typed.length > 0 && matched.length === 0) {
      fb.textContent = 'Eşleşen anlam bulunamadı. Tam kelimeyi yaz.';
    } else if (matched.length > 0 && matched.length < req) {
      fb.textContent = `${matched.length} anlam bulundu, en az ${req} gerekli.`;
    } else { fb.textContent = ''; }
    fb.className = 'fb';
  }
}
function finishCard(skipped) {
  if (answered) return;
  answered = true;
  const c = cards[cur];
  const matched = c.meanings.filter(m => typed.some(a => exactMatch(a, m)));
  const req = required(c);
  let pts = 0, status = 'fail';
  if (!skipped) {
    if (matched.length >= c.meanings.length) { pts = c.meanings.length; status = 'ok'; }
    else if (matched.length >= req)          { pts = matched.length;    status = 'part'; }
  }
  score += pts;
  results.push({ word: c.word, meanings: c.meanings, status, pts });
  document.getElementById('lscore').textContent = score;
  document.getElementById('btnnext').disabled = false;
  if (!flipped) flipCard();
  document.getElementById('aarea').style.display = 'none';
}
function skipCard() { finishCard(true); nextCard(); }
function nextCard() {
  if (!answered) { finishCard(false); return; }
  cur++;
  if (cur >= cards.length) { showResults(); return; }
  loadCard();
}
function showResults() {
  document.getElementById('progf').style.width = '100%';
  const ok   = results.filter(r => r.status === 'ok').length;
  const part = results.filter(r => r.status === 'part').length;
  document.getElementById('rscore').textContent   = score;
  document.getElementById('rcorrect').textContent = ok;
  document.getElementById('rpartial').textContent = part;
  document.getElementById('rlist').innerHTML = results.map(r => {
    const bc = r.status==='ok' ? 'bok' : r.status==='part' ? 'bpart' : 'bfail';
    const bt = r.status==='ok' ? 'Tam' : r.status==='part' ? 'Kısmen' : 'Atlandı';
    return `<div class="ritem">
      <span class="bdg ${bc}">${bt}</span>
      <span class="rword">${r.word}</span>
      <span class="rdefs">${r.meanings.join(', ')}</span>
      <span class="rpts">${r.pts > 0 ? '+'+r.pts+' puan' : '0 puan'}</span>
    </div>`;
  }).join('');
  show('screen-result');
}
function restartGame() {
  cur = 0; score = 0; results = [];
  cards = cards.sort(() => Math.random() - .5);
  show('screen-game'); loadCard();
}
</script>
